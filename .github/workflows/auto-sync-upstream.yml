name: Auto Sync Upstream

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      
      - name: Configure Git
        run: |
          git config user.name "Auto Sync Bot"
          git config user.email "action@github.com"
      
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/distribution/distribution.git
          git fetch upstream
      
      - name: Check for upstream changes
        id: check_changes
        run: |
          if git log --oneline upstream/main ^HEAD | head -1; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "✅ Upstream changes detected"
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No upstream changes to sync"
          fi
      
      - name: Attempt automatic merge
        if: steps.check_changes.outputs.changes == 'true'
        id: auto_merge
        run: |
          # Try automatic merge (go.mod conflicts auto-resolved via .gitattributes)
          if git merge upstream/main --no-edit; then
            echo "merge_success=true" >> $GITHUB_OUTPUT
            echo "✅ Automatic merge successful"
          else
            echo "merge_success=false" >> $GITHUB_OUTPUT
            echo "⚠️ Merge conflicts require manual resolution"
            git merge --abort
          fi
      
      - name: Update dependencies
        if: steps.check_changes.outputs.changes == 'true' && steps.auto_merge.outputs.merge_success == 'true'
        run: |
          echo "📦 Updating vendor directory..."
          go mod vendor
          
          # Commit vendor changes if any
          if ! git diff --quiet; then
            git add vendor/
            git commit -m "Update vendor directory after upstream sync"
          fi
      
      - name: Test NATS functionality
        if: steps.check_changes.outputs.changes == 'true' && steps.auto_merge.outputs.merge_success == 'true'
        run: |
          echo "🧪 Testing build and NATS functionality..."
          make build
          
          # Quick NATS driver test (skip slow integration tests in CI)
          go test ./registry/storage/driver/nats/ -short -v
      
      - name: Push changes
        if: steps.check_changes.outputs.changes == 'true' && steps.auto_merge.outputs.merge_success == 'true'
        run: |
          echo "⬆️ Pushing synced changes..."
          git push origin main
      
      - name: Create success notification
        if: steps.check_changes.outputs.changes == 'true' && steps.auto_merge.outputs.merge_success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '✅ Automatic upstream sync completed',
              body: `🎉 Successfully synced with upstream distribution repository!
              
              **Details:**
              - **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              - **Branch:** main
              - **Time:** ${{ github.event.head_commit.timestamp || 'Manual trigger' }}
              
              **Changes Applied:**
              - Merged latest upstream changes
              - Updated vendor dependencies  
              - Verified NATS driver functionality
              
              The NATS fork is now up to date! 🚀`,
              labels: ['auto-sync', 'success']
            })
      
      - name: Create failure notification
        if: steps.check_changes.outputs.changes == 'true' && steps.auto_merge.outputs.merge_success == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Automatic upstream sync failed - Manual intervention required',
              body: `❌ Automatic sync with upstream failed due to merge conflicts.
              
              **Details:**
              - **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              - **Branch:** main  
              - **Time:** ${{ github.event.head_commit.timestamp || 'Manual trigger' }}
              
              **Action Required:**
              Please manually resolve the merge conflicts:
              
              \`\`\`bash
              git fetch upstream
              git merge upstream/main
              # Resolve conflicts manually
              go mod vendor
              make build
              git push origin main
              \`\`\`
              
              **Common Conflicts:**
              - \`go.mod\` should auto-resolve (keep Go 1.24)
              - Other files: prefer upstream unless NATS-specific
              
              See [NATS_FORK_SYNC.md](./NATS_FORK_SYNC.md) for detailed instructions.`,
              labels: ['auto-sync', 'manual-intervention-required', 'urgent']
            })
      
      - name: Cleanup on failure
        if: failure()
        run: |
          echo "🧹 Cleaning up failed merge state..."
          git merge --abort 2>/dev/null || true
          git reset --hard HEAD